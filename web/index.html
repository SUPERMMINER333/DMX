<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Controller Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #764ba2;
            font-size: 18px;
        }

        .channel-control {
            margin-bottom: 15px;
        }

        .channel-control label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .channel-value {
            text-align: right;
            font-weight: bold;
            color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .fixture-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .fixture-item {
            padding: 10px;
            background: #f9fafb;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .fixture-item:hover {
            background: #f3f4f6;
        }

        .fixture-item.active {
            background: #dbeafe;
            border-left: 3px solid #667eea;
        }

        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .scene-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 5px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #f3f4f6;
            color: #333;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 DMX Controller</h1>
            <div class="status">
                <div class="status-item">
                    <span class="status-dot" id="dmx-status"></span>
                    <span>DMX: <span id="dmx-text">Connecting...</span></span>
                </div>
                <div class="status-item">
                    <span>Fixtures: <span id="fixture-count">0</span></span>
                </div>
                <div class="status-item">
                    <span>Scenes: <span id="scene-count">0</span></span>
                </div>
                <div class="status-item">
                    <span>Mode: <span id="current-mode">-</span></span>
                </div>
            </div>
        </header>

        <div class="grid">
            <!-- Quick Control -->
            <div class="card">
                <h2>Quick Control</h2>
                <div class="mode-selector">
                    <button class="mode-btn" onclick="setMode('direct')">Direct</button>
                    <button class="mode-btn" onclick="setMode('fixture')">Fixture</button>
                    <button class="mode-btn" onclick="setMode('scene')">Scene</button>
                </div>

                <div class="channel-control">
                    <label>Channel 1: <span class="channel-value" id="ch0-val">0</span></label>
                    <input type="range" min="0" max="255" value="0" id="ch0" oninput="setChannel(0, this.value)">
                </div>

                <div class="channel-control">
                    <label>Channel 2: <span class="channel-value" id="ch1-val">0</span></label>
                    <input type="range" min="0" max="255" value="0" id="ch1" oninput="setChannel(1, this.value)">
                </div>

                <div class="channel-control">
                    <label>Channel 3: <span class="channel-value" id="ch2-val">0</span></label>
                    <input type="range" min="0" max="255" value="0" id="ch2" oninput="setChannel(2, this.value)">
                </div>

                <div class="channel-control">
                    <label>Channel 4: <span class="channel-value" id="ch3-val">0</span></label>
                    <input type="range" min="0" max="255" value="0" id="ch3" oninput="setChannel(3, this.value)">
                </div>

                <button class="danger" onclick="blackout()">⚡ Blackout</button>
            </div>

            <!-- Fixtures -->
            <div class="card">
                <h2>Fixtures</h2>
                <div class="fixture-list" id="fixture-list">
                    <p style="color: #999;">Keine Fixtures</p>
                </div>
            </div>

            <!-- Scenes -->
            <div class="card">
                <h2>Scenes</h2>
                <div class="scene-list" id="scene-list">
                    <p style="color: #999;">Keine Szenen</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Update status
        async function updateStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();

                document.getElementById('dmx-status').className = data.dmx_connected ? 'status-dot' : 'status-dot offline';
                document.getElementById('dmx-text').textContent = data.dmx_connected ? 'Connected' : 'Disconnected';
                document.getElementById('fixture-count').textContent = data.fixtures_count;
                document.getElementById('scene-count').textContent = data.scenes_count;
                document.getElementById('current-mode').textContent = data.mode;

                // Update mode buttons
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const activeBtn = Array.from(document.querySelectorAll('.mode-btn')).find(
                    btn => btn.textContent.toLowerCase() === data.mode.toLowerCase()
                );
                if (activeBtn) activeBtn.classList.add('active');

            } catch (error) {
                console.error('Status update failed:', error);
                document.getElementById('dmx-status').className = 'status-dot offline';
                document.getElementById('dmx-text').textContent = 'Error';
            }
        }

        // Load fixtures
        async function loadFixtures() {
            try {
                const response = await fetch(`${API_URL}/fixtures`);
                const data = await response.json();

                const list = document.getElementById('fixture-list');
                if (data.fixtures && data.fixtures.length > 0) {
                    list.innerHTML = data.fixtures.map(f => `
                        <div class="fixture-item">
                            <strong>${f.name}</strong><br>
                            <small>Ch ${f.start_channel}-${f.start_channel + f.num_channels - 1} | ${f.manufacturer}</small>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color: #999;">Keine Fixtures</p>';
                }
            } catch (error) {
                console.error('Load fixtures failed:', error);
            }
        }

        // Load scenes
        async function loadScenes() {
            try {
                const response = await fetch(`${API_URL}/scenes`);
                const data = await response.json();

                const list = document.getElementById('scene-list');
                if (data.scenes && data.scenes.length > 0) {
                    list.innerHTML = data.scenes.map(s => `
                        <div class="scene-item">
                            <div>
                                <strong>${s.name}</strong><br>
                                <small>${s.description || 'Keine Beschreibung'}</small>
                            </div>
                            <button onclick="recallScene('${s.id}')">▶ Recall</button>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color: #999;">Keine Szenen</p>';
                }
            } catch (error) {
                console.error('Load scenes failed:', error);
            }
        }

        // Set DMX channel
        async function setChannel(channel, value) {
            document.getElementById(`ch${channel}-val`).textContent = value;

            try {
                await fetch(`${API_URL}/dmx/channel/${channel}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({value: parseInt(value)})
                });
            } catch (error) {
                console.error('Set channel failed:', error);
            }
        }

        // Set mode
        async function setMode(mode) {
            try {
                await fetch(`${API_URL}/mode`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mode: mode})
                });
                updateStatus();
            } catch (error) {
                console.error('Set mode failed:', error);
            }
        }

        // Recall scene
        async function recallScene(sceneId) {
            try {
                await fetch(`${API_URL}/scenes/${sceneId}/recall`, {
                    method: 'POST'
                });
            } catch (error) {
                console.error('Recall scene failed:', error);
            }
        }

        // Blackout
        async function blackout() {
            try {
                await fetch(`${API_URL}/blackout`, {
                    method: 'POST'
                });

                // Reset sliders
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`ch${i}`).value = 0;
                    document.getElementById(`ch${i}-val`).textContent = 0;
                }
            } catch (error) {
                console.error('Blackout failed:', error);
            }
        }

        // Auto-refresh
        setInterval(updateStatus, 1000);
        setInterval(loadFixtures, 5000);
        setInterval(loadScenes, 5000);

        // Initial load
        updateStatus();
        loadFixtures();
        loadScenes();
    </script>
</body>
</html>
